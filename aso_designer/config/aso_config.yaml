# ASODesigner default configuration
# ================================
# All parameters have inline documentation explaining their purpose.
# Override any of these by providing your own YAML config file or CLI flags.

# ---------------------------------------------------------------------------
# NCBI access (used by transcript and variant fetching)
# ---------------------------------------------------------------------------
# Uncomment and fill in to identify yourself to NCBI E-utilities and/or
# raise the rate limit. Falls back to the NCBI_EMAIL and NCBI_API_KEY
# environment variables when omitted.
#
# fetch:
#   # Email address for NCBI API identification (recommended by NCBI).
#   email: user@example.com
#
#   # NCBI API key for higher rate limits (10 req/s vs 3 req/s without one).
#   # Get a key at https://www.ncbi.nlm.nih.gov/account/.
#   api_key: your_api_key

# ---------------------------------------------------------------------------
# Candidate generation
# ---------------------------------------------------------------------------
candidate:
  # Length of the ASO oligonucleotide in nucleotides.
  # Typical therapeutic ASOs range from 15 to 25 nt.
  length: 20

  # Step size for sliding window across the transcript (1 = overlap by length-1).
  step: 1

  # Minimum and maximum GC content (fraction 0.0–1.0).
  # GC content outside 30–60% is generally suboptimal for ASO binding.
  gc_min: 0.30
  gc_max: 0.60

  # Maximum allowed consecutive identical bases (homopolymer run).
  # Long homopolymers can cause non-specific binding and synthesis issues.
  homopolymer_max: 4

  # Chemistry type: gapmer, mixmer, 2ome, moe, morpholino
  chemistry: gapmer

# ---------------------------------------------------------------------------
# Gapmer-specific settings (only used when chemistry is "gapmer")
# ---------------------------------------------------------------------------
gapmer:
  # Number of DNA nucleotides in the center (RNase H recruitment region).
  # Typical gap sizes: 8–10 nt for a 20-mer.
  gap_size: 10

  # Wing length (modified nucleotides on each side of the DNA gap).
  wing_length: 5

  # Wing chemistry: 2ome (2'-O-methyl), moe (2'-O-methoxyethyl)
  wing_chemistry: moe

# ---------------------------------------------------------------------------
# Mixmer-specific settings (only used when chemistry is "mixmer")
# ---------------------------------------------------------------------------
mixmer:
  # Pattern of modifications (list of booleans, True = modified).
  # Length must match candidate length. Example for 20-mer:
  #   [true, false, true, false, ...]
  pattern: []

  # Modification type for marked positions.
  modification: 2ome

# ---------------------------------------------------------------------------
# RNA accessibility (ViennaRNA)
# ---------------------------------------------------------------------------
accessibility:
  # Accessibility tool: 'rnaplfold' computes sliding-window unpaired
  # probabilities; 'rnaup' computes per-site opening energies (dG_open)
  # that complement the unpaired-probability screen.
  method: rnaplfold

  # Unpaired-region length for the RNAup method (-u).
  unpaired_region: 4

  # Unpaired-region lengths for the RNAplfold method (-u 1,2,...). The
  # default [1] keeps per-nucleotide accessibility; e.g. [1, 2, 3, 4]
  # also exposes multi-nucleotide stretch probabilities.
  unpaired_lengths: [1]

  # RNAplfold sliding window size (nt) for local accessibility.
  # Larger windows capture longer-range interactions but are slower.
  window_size: 150

  # Maximum pairing distance (nt). Pairs beyond this are not considered.
  max_pairing_distance: 100

  # Accessibility score threshold below which a site is "accessible".
  # Range 0.0 (fully paired) to 1.0 (fully unpaired).
  accessible_threshold: 0.5

# ---------------------------------------------------------------------------
# Thermodynamics
# ---------------------------------------------------------------------------
thermodynamics:
  # Computation method:
  #   nearest_neighbor — fast DNA/RNA NN model, no ViennaRNA needed
  #   rnafold          — ViennaRNA RNAfold for self/target structure
  #   rnaduplex        — ViennaRNA RNAduplex for the duplex ΔG
  method: nearest_neighbor

  # Melting temperature (Tm) range in degrees Celsius.
  # Candidates outside this range are filtered out.
  tm_min: 40.0
  tm_max: 65.0
  tm_optimal: 52.0

  # Salt concentration (M) for Tm calculation.
  na_conc: 0.1

  # Oligo concentration (M) for Tm calculation.
  oligo_conc: 1.0e-6

  # Magnesium concentration (M). When > 0, Tm uses the Owczarzy 2008
  # divalent-ion correction (replacing the monovalent-only correction).
  # 0 disables the Mg2+ correction.
  mg_conc: 0.0

  # dNTP concentration (M). dNTPs chelate Mg2+; the free Mg2+ fraction is
  # used in the Owczarzy correction. Only meaningful when mg_conc > 0.
  dntp_conc: 0.0

  # Maximum allowed self-structure ΔG (kcal/mol).
  # Candidates with ΔG self below this (more negative) are penalized.
  self_structure_max: -3.0

  # Fraction of the perfect-duplex ΔG attributed to intramolecular
  # self-structure in the nearest-neighbor approximation (0 < x ≤ 1).
  # Lower values assume less self-structure; 0.3 is a common heuristic.
  # Only used when method is "nearest_neighbor".
  self_structure_nn_fraction: 0.3

  # Minimum net binding ΔG (kcal/mol). More negative = stronger binding.
  binding_min: -5.0

  # Optional directory for caching ViennaRNA duplex/self-structure results
  # on disk. Only used with the ViennaRNA methods; speeds up repeated runs
  # over the same candidates. Leave unset to disable caching.
  # cache_dir: .aso_cache/thermo

# ---------------------------------------------------------------------------
# Off-target analysis
# ---------------------------------------------------------------------------
off_target:
  # Path to a transcriptome FASTA file for off-target search (e.g. a
  # RefSeq mRNA set for the organism of interest). If omitted, the
  # off-target stage is skipped and neutral scores are used.
  # transcriptome_path: /data/refseq_mrna_human.fna

  # Maximum mismatches allowed for off-target hits.
  max_mismatches: 3

  # Seed region definition (positions relative to ASO 5' end, 0-based).
  seed_start: 2
  seed_end: 8

  # Weight applied to seed-region mismatches (higher = more penalizing).
  seed_mismatch_weight: 2.0

  # Maximum off-target hits allowed before a candidate is filtered.
  max_hits: 50

# ---------------------------------------------------------------------------
# Variant / SNP awareness
# ---------------------------------------------------------------------------
variant:
  # Path to a VCF file with known variants for the target. Variant
  # positions are interpreted in transcript coordinates (the coordinate
  # system of the fetched transcript sequence). If omitted, variants are
  # fetched from the dbSNP/ClinVar APIs when a gene name is available.
  # vcf_path: /data/variants.vcf

  # Minimum minor allele frequency (MAF) to flag a variant.
  maf_threshold: 0.01

  # Penalty multiplier for variants in the seed region vs. non-seed.
  seed_region_multiplier: 3.0

  # Flag candidates overlapping pathogenic ClinVar variants.
  flag_pathogenic: true

# ---------------------------------------------------------------------------
# Scoring weights (must sum to 1.0)
# ---------------------------------------------------------------------------
# Each weight determines the relative contribution of a sub-score to the
# final composite score. Adjust based on your prioritization needs.
# All sub-scores are normalized to 0.0–1.0 before weighting.
scoring:
  weights:
    accessibility: 0.25
    thermodynamics: 0.20
    gc_content: 0.10
    off_target: 0.20
    variant: 0.10
    self_structure: 0.10
    positional: 0.05

# ---------------------------------------------------------------------------
# Reporting
# ---------------------------------------------------------------------------
reporting:
  # Output directory for reports and data files.
  output_dir: "results"

  # Generate HTML report in addition to JSON.
  generate_html: true

  # Include full off-target details in the report (can be large).
  include_offtarget_details: true
