# Ruff configuration for ASODesigner

target-version = "py310"
line-length = 100

# Exclude markdown files (docs contain code blocks ruff tries to format)
extend-exclude = ["*.md"]

[lint]
# Enable: pycodestyle (E, W), pyflakes (F), isort (I),
# pyupgrade (UP), flake8-bugbear (B), flake8-comprehensions (C4)
select = ["E", "W", "F", "I", "UP", "B", "C4"]

# Ignore: line-too-long handled by formatter, magic-value-comparison too noisy in tests
ignore = ["E501"]

[lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False is fine in tests

[format]
quote-style = "double"
indent-style = "space"
